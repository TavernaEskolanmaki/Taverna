<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaokehaku – Taverna Eskolanmäki</title>

<style>
/* ------------------------------
   NORDIC ICE BLUE – MODERNI UI
   ------------------------------ */

:root {
    --bg: #f4f9ff;
    --bg2: #ffffff;
    --text: #1a1a1a;
    --subtext: #4a4a4a;
    --accent: #3a7bd5;
    --accent-light: #d8e9ff;
    --border: #d0d8e4;
    --shadow: rgba(0,0,0,0.08);

    --dark-bg: #1e1f22;
    --dark-bg2: #2a2c31;
    --dark-text: #f0f0f0;
    --dark-subtext: #c0c0c0;
    --dark-accent: #6aa8ff;
    --dark-border: #3a3d42;
    --dark-shadow: rgba(0,0,0,0.4);
}

body {
    margin: 0;
    font-family: "Inter", sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .3s, color .3s;
}

body.tumma {
    background: var(--dark-bg);
    color: var(--dark-text);
}

header {
    padding: 20px;
    text-align: center;
}

h1 {
    margin: 0;
    font-size: 2rem;
    font-weight: 600;
}

#haku {
    margin-top: 15px;
    padding: 12px 14px;
    font-size: 1rem;
    width: 90%;
    max-width: 500px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg2);
    transition: background .3s, border .3s;
}

body.tumma #haku {
    background: var(--dark-bg2);
    border-color: var(--dark-border);
    color: var(--dark-text);
}

nav {
    margin: 20px auto;
    text-align: center;
}

nav button {
    margin: 3px;
    padding: 8px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg2);
    cursor: pointer;
    transition: background .2s, color .2s;
}

body.tumma nav button {
    background: var(--dark-bg2);
    border-color: var(--dark-border);
    color: var(--dark-text);
}

nav button:hover {
    background: var(--accent-light);
}

body.tumma nav button:hover {
    background: var(--dark-accent);
    color: #000;
}

#kokolista {
    text-align: center;
    margin-top: 10px;
    font-size: 0.9rem;
    color: var(--subtext);
}

body.tumma #kokolista {
    color: var(--dark-subtext);
}

/* ------------------------------
   HYBRIDI: TAULUKKO DESKTOPISSA
   ------------------------------ */

#taulukko {
    width: 95%;
    max-width: 1100px;
    margin: 20px auto;
    border-collapse: collapse;
    background: var(--bg2);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px var(--shadow);
}

body.tumma #taulukko {
    background: var(--dark-bg2);
    box-shadow: 0 2px 8px var(--dark-shadow);
}

#taulukko th, #taulukko td {
    padding: 12px;
    border-bottom: 1px solid var(--border);
}

body.tumma #taulukko th, 
body.tumma #taulukko td {
    border-color: var(--dark-border);
}

#taulukko th {
    background: var(--accent-light);
    cursor: pointer;
}

body.tumma #taulukko th {
    background: var(--dark-accent);
    color: #000;
}

.sort-asc::after { content: " ▲"; }
.sort-desc::after { content: " ▼"; }

/* ------------------------------
   HYBRIDI: KORTIT MOBIILISSA
   ------------------------------ */

@media (max-width: 700px) {
    #taulukko { display: none; }

    .card {
        width: 90%;
        margin: 12px auto;
        padding: 14px;
        background: var(--bg2);
        border-radius: 10px;
        box-shadow: 0 2px 6px var(--shadow);
    }

    body.tumma .card {
        background: var(--dark-bg2);
        box-shadow: 0 2px 6px var(--dark-shadow);
        color: var(--dark-text);
    }

    .card-title {
        font-size: 1.1rem;
        font-weight: 600;
    }

    .card-sub {
        color: var(--subtext);
        margin-top: 4px;
    }

    body.tumma .card-sub {
        color: var(--dark-subtext);
    }
}

/* ------------------------------ */

mark {
    background: var(--accent);
    color: #fff;
    padding: 1px 3px;
    border-radius: 3px;
}

body.tumma mark {
    background: var(--dark-accent);
    color: #000;
}

#eiLoytynyt {
    text-align: center;
    margin-top: 20px;
    display: none;
}

#teemanappi {
    margin-top: 20px;
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
}

</style>
</head>

<body class="vaalea">

<header>
    <h1 id="otsikko">Karaokehaku – Taverna Eskolanmäki</h1>
    <input id="haku" type="text" placeholder="Hae artistia, kappaletta, konetta tai koodia…">
    <br>
    <button id="teemanappi" onclick="vaihdaTeema()">Tumma teema</button>
</header>

<nav id="kirjainnav"></nav>

<div id="kokolista"></div>

<table id="taulukko">
    <thead>
        <tr>
            <th id="th-artisti" onclick="jarjesta('ARTISTI')">Artisti</th>
            <th id="th-kappale" onclick="jarjesta('KAPPALE')">Kappale</th>
            <th id="th-kone" onclick="jarjesta('KONE')">Kone</th>
            <th id="th-koodi" onclick="jarjesta('KOODI')">Koodi</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<div id="kortit"></div>

<div id="eiLoytynyt">Ei löytynyt</div>

<div id="paivitysaika" style="text-align:center; margin:20px;"></div>

<script>
/* ------------------------------
   MODERNI OPTIMOITU JAVASCRIPT
   ------------------------------ */

function koneVari(kone) {
    if (kone === "MAD") return "#e8ffd0";
    if (kone === "MEL") return "#ffe8d0";
    return "";
}

let data = [];
let currentLetter = "";
let sortKey = "ARTISTI";
let sortDir = "asc";

/* ------------------------------
   CSV-LATAUS
   ------------------------------ */

async function lataaCSV() {
    const url = "https://raw.githubusercontent.com/TavernaEskolanmaki/Taverna/main/kappaleet.csv";
    const res = await fetch(url);
    const txt = await res.text();

    data = txt.trim().split("\n").map((r, idx) => {
        const c = r.split(",");
        return {
            ARTISTI: c[0],
            KAPPALE: c[1],
            KONE: c[2],
            KOODI: c[3],
            artistUpper: c[0].toUpperCase(),
            kappaleUpper: c[1].toUpperCase(),
            koneUpper: c[2].toUpperCase(),
            koodiUpper: c[3].toUpperCase(),
            index: idx
        };
    });

    paivitaTaulukko();
}

/* ------------------------------
   HAKU
   ------------------------------ */

function haeTeksti() {
    return document.getElementById("haku").value.toUpperCase().trim();
}

/* ------------------------------
   KIRJAINVALINTA
   ------------------------------ */

function luoKirjainNapit() {
    const nav = document.getElementById("kirjainnav");
    const kirjaimet = "ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ".split("");

    kirjaimet.forEach(k => {
        const b = document.createElement("button");
        b.textContent = k;
        b.onclick = () => { currentLetter = k; paivitaTaulukko(); };
        nav.appendChild(b);
    });

    const tyhja = document.createElement("button");
    tyhja.textContent = "Kaikki";
    tyhja.onclick = () => { currentLetter = ""; paivitaTaulukko(); };
    nav.appendChild(tyhja);
}

/* ------------------------------
   TURVALLINEN HIGHLIGHTTAUS
   ------------------------------ */

function highlightText(node, terms) {
    if (!terms.length) return;

    const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
    const nodes = [];

    while (walker.nextNode()) nodes.push(walker.currentNode);

    nodes.forEach(n => {
        let original = n.nodeValue;
        let replaced = original;

        terms.forEach(t => {
            const esc = t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            replaced = replaced.replace(new RegExp(esc, "gi"), m => `@@@${m}@@@`);
        });

        if (replaced === original) return;

        const frag = document.createDocumentFragment();
        replaced.split(/(@@@.*?@@@)/).forEach(part => {
            if (part.startsWith("@@@")) {
                const mark = document.createElement("mark");
                mark.textContent = part.slice(3, -3);
                frag.appendChild(mark);
            } else {
                frag.appendChild(document.createTextNode(part));
            }
        });

        n.parentNode.replaceChild(frag, n);
    });
}

/* ------------------------------
   TAULUKON JA KORTTIEN PÄIVITYS
   ------------------------------ */

function paivitaTaulukko() {
    const haku = haeTeksti();
    const terms = haku ? haku.split(/\s+/).filter(Boolean) : [];

    let rivit = data.filter(r => {
        if (currentLetter && !r.artistUpper.startsWith(currentLetter)) return false;
        if (!terms.length) return true;

        return terms.every(t =>
            r.artistUpper.includes(t) ||
            r.kappaleUpper.includes(t) ||
            r.koneUpper.includes(t) ||
            r.koodiUpper.includes(t)
        );
    });

    rivit.sort((a, b) => {
        let va = a[sortKey].toUpperCase();
        let vb = b[sortKey].toUpperCase();
        return sortDir === "asc" ? va.localeCompare(vb) : vb.localeCompare(va);
    });

    /* TAULUKKO DESKTOPILLE */
    const tbody = document.querySelector("#taulukko tbody");
    tbody.innerHTML = "";

    rivit.forEach(r => {
        const tr = document.createElement("tr");

        ["ARTISTI","KAPPALE","KONE","KOODI"].forEach(k => {
            const td = document.createElement("td");
            td.textContent = r[k];
            highlightText(td, terms);
            if (k === "KONE") td.style.backgroundColor = koneVari(r.KONE);
            tr.appendChild(td);
        });

        tbody.appendChild(tr);
    });

    /* KORTIT MOBIILILLE */
    const kortit = document.getElementById("kortit");
    kortit.innerHTML = "";

    rivit.forEach(r => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="card-title">${r.ARTISTI}</div>
            <div class="card-sub">${r.KAPPALE}</div>
            <div class="card-sub">Kone: ${r.KONE}</div>
            <div class="card-sub">Koodi: ${r.KOODI}</div>
        `;

        highlightText(card, terms);
        kortit.appendChild(card);
    });

    /* LÖYTYMISINFO */
    document.getElementById("eiLoytynyt").style.display = rivit.length ? "none" : "block";

    /* KOKO LISTA */
    document.getElementById("kokolista").innerText =
        (!haku && !currentLetter)
        ? `Koko lista ${data.length} kpl`
        : `Tuloksia ${rivit.length} kpl`;

    paivitaSortOtsikot();
}

/* ------------------------------
   LAJITTELU
   ------------------------------ */

function jarjesta(key) {
    if (sortKey === key) sortDir = sortDir === "asc" ? "desc" : "asc";
    else { sortKey = key; sortDir = "asc"; }
    paivitaTaulukko();
}

function paivitaSortOtsikot() {
    ["ARTISTI","KAPPALE","KONE","KOODI"].forEach(k => {
        const th = document.getElementById("th-" + k.toLowerCase());
        th.classList.remove("sort-asc","sort-desc");
        if (k === sortKey) th.classList.add(sortDir === "asc" ? "sort-asc" : "sort-desc");
    });
}

/* ------------------------------
   TEEMA
   ------------------------------ */

function vaihdaTeema() {
    const body = document.body;
    const btn = document.getElementById("teemanappi");

    if (body.classList.contains("tumma")) {
        body.classList.remove("tumma");
        btn.textContent = "Tumma teema";
    } else {
        body.classList.add("tumma");
        btn.textContent = "Vaalea teema";
    }
}

/* ------------------------------
   PÄIVITYSAIKA
   ------------------------------ */

async function haePaivitysaika() {
    const apiUrl = "https://api.github.com/repos/TavernaEskolanmaki/Taverna/commits?path=kappaleet.csv";

    try {
        const res = await fetch(apiUrl);
        const data = await res.json();
        const pvm = new Date(data[0].commit.author.date);

        document.getElementById("paivitysaika").innerText =
            `Viimeksi päivitetty: ${pvm.getDate()}.${pvm.getMonth()+1}.${pvm.getFullYear()} klo ${pvm.getHours()}:${pvm.getMinutes().toString().padStart(2,"0")}`;
    } catch {
        document.getElementById("paivitysaika").innerText = "Virhe päivitysajan haussa";
    }
}

/* ------------------------------
   INIT
   ------------------------------ */

window.addEventListener("load", () => {
    luoKirjainNapit();
    lataaCSV();
    haePaivitysaika();
});
</script>

</body>
</html>
