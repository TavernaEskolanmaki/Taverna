<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaokehaku – Taverna Eskolanmäki</title>

<style>
/* ------------------------------
   NORDIC ICE BLUE – MODERNI UI
   ------------------------------ */

:root {
    --bg: #f4f9ff;
    --bg2: #ffffff;
    --text: #1a1a1a;
    --subtext: #4a4a4a;
    --accent: #3a7bd5;
    --accent-light: #d8e9ff;
    --border: #d0d8e4;
    --shadow: rgba(0,0,0,0.08);

    --dark-bg: #1e1f22;
    --dark-bg2: #2a2c31;
    --dark-text: #f0f0f0;
    --dark-subtext: #c0c0c0;
    --dark-accent: #6aa8ff;
    --dark-border: #3a3d42;
    --dark-shadow: rgba(0,0,0,0.4);
}

body {
    margin: 0;
    font-family: "Inter", sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .3s, color .3s;
}

body.tumma {
    background: var(--dark-bg);
    color: var(--dark-text);
}

header {
    padding: 20px;
    text-align: center;
}

h1 {
    margin: 0;
    font-size: 2rem;
    font-weight: 600;
}

#haku {
    margin-top: 15px;
    padding: 12px 14px;
    font-size: 1rem;
    width: 90%;
    max-width: 500px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg2);
    transition: background .3s, border .3s;
}

body.tumma #haku {
    background: var(--dark-bg2);
    border-color: var(--dark-border);
    color: var(--dark-text);
}

nav {
    margin: 20px auto;
    text-align: center;
}

nav button {
    margin: 3px;
    padding: 8px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg2);
    cursor: pointer;
    transition: background .2s, color .2s;
}

body.tumma nav button {
    background: var(--dark-bg2);
    border-color: var(--dark-border);
    color: var(--dark-text);
}

nav button:hover {
    background: var(--accent-light);
}

body.tumma nav button:hover {
    background: var(--dark-accent);
    color: #000;
}

#kokolista {
    text-align: center;
    margin-top: 10px;
    font-size: 0.9rem;
    color: var(--subtext);
}

body.tumma #kokolista {
    color: var(--dark-subtext);
}

/* ------------------------------
   HYBRIDI: TAULUKKO DESKTOPISSA
   ------------------------------ */

#taulukko {
    width: 95%;
    max-width: 1100px;
    margin: 20px auto;
    border-collapse: collapse;
    background: var(--bg2);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px var(--shadow);
}

body.tumma #taulukko {
    background: var(--dark-bg2);
    box-shadow: 0 2px 8px var(--dark-shadow);
}

#taulukko th, #taulukko td {
    padding: 12px;
    border-bottom: 1px solid var(--border);
}

body.tumma #taulukko th, 
body.tumma #taulukko td {
    border-color: var(--dark-border);
}

#taulukko th {
    background: var(--accent-light);
    cursor: pointer;
}

body.tumma #taulukko th {
    background: var(--dark-accent);
    color: #000;
}

.sort-asc::after { content: " ▲"; }
.sort-desc::after { content: " ▼"; }

/* ------------------------------
   HYBRIDI: KORTIT MOBIILISSA
   ------------------------------ */

@media (max-width: 700px) {
    #taulukko { display: none; }

    .card {
        width: 90%;
        margin: 12px auto;
        padding: 14px;
        background: var(--bg2);
        border-radius: 10px;
        box-shadow: 0 2px 6px var(--shadow);
    }

    body.tumma .card {
        background: var(--dark-bg2);
        box-shadow: 0 2px 6px var(--dark-shadow);
        color: var(--dark-text);
    }

    .card-title {
        font-size: 1.1rem;
        font-weight: 600;
    }

    .card-sub {
        color: var(--subtext);
        margin-top: 4px;
    }

    body.tumma .card-sub {
        color: var(--dark-subtext);
    }
}

/* ------------------------------ */

mark {
    background: var(--accent);
    color: #fff;
    padding: 1px 3px;
    border-radius: 3px;
}

body.tumma mark {
    background: var(--dark-accent);
    color: #000;
}

#eiLoytynyt {
    text-align: center;
    margin-top: 20px;
    display: none;
}

#teemanappi {
    margin-top: 20px;
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
}

</style>
</head>

    <br>
    <button id="teemanappi" onclick="vaihdaTeema()">Tumma teema</button>
</header>

<nav id="kirjainnav"></nav>

<div id="kokolista"></div>

            <th id="th-koodi" onclick="jarjesta('KOODI')">Koodi</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<div id="kortit"></div>

<div id="eiLoytynyt">Ei löytynyt</div>

<div id="paivitysaika" style="text-align:center; margin:20px;"></div>
