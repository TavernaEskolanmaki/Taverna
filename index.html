<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<!-- Ei viewport-metatietoa: silloin puhelin näyttää sivun pienenä kokonaisuutena
     (kuten ennen) ja niputuszoomaus toimii vapaasti suureen ja pieneen. -->
<title>Karaoke kappale haku Taverna</title>

<style>
body.vaalea { background:#ffffff; color:#000; font-family:Arial, sans-serif; margin:20px; }
body.tumma  { background:#121212; color:#e0e0e0; font-family:Arial, sans-serif; margin:20px; }

#ylapalkki {
    position: sticky;
    top: 0;
    background: inherit;
    padding-bottom: 10px;
    z-index: 20;
}

/* Poistaa puhelimien napautusviiveen ja zoomauksen tuplanapautuksella */
button, input { touch-action: manipulation; }
button { -webkit-tap-highlight-color: transparent; }

/* Header-rakenne: otsikko vasemmalle, "Taverna" oikealle */
.header-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: nowrap;
}
h2#otsikko {
    margin: 0 0 6px 0;
    display: inline-block;
    font-size: 24px;
}
#brand {
    font-weight: bold;
    font-size: 16px;
    opacity: 0.9;
    align-self: center;
}

/* Haku-otsikko omalle rivilleen */
h3#haku-otsikko {
    margin: 6px 0 8px 0;
    display: block;
    font-size: 18px;
}

/* Controls: haku-kenttä ja napit omalla rivillään */
#controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-top: 4px;
}

/* Haku-kentän leveys asetetaan JS:llä vastaamaan otsikon renderöityä leveyttä */
#controls input {
    padding: 10px;
    font-size: 18px;
    box-sizing: border-box;
    min-width: 180px;
    width: auto;
}

button {
    padding: 6px 12px;
    margin: 4px 4px 0 0;
    font-size: 14px;
    cursor: pointer;
}

#aznav {
    margin-top: 8px;
    margin-bottom: 8px;
}
#aznav button {
    padding: 4px 8px;
    font-size: 13px;
}

.table-wrapper {
    margin-top: 20px;
    overflow-x: auto;
}

table {
    border-collapse: collapse;
    width: 100%;
    min-width: 480px;
}
th, td {
    border: 1px solid #999;
    padding: 6px 8px;
    font-size: 14px;
}

tbody tr:hover { background: rgba(255,255,0,0.25); }

body.vaalea thead th { background:#eee; color:#000; }
body.tumma  thead th { background:#1f1f1f; color:#fff; }

thead th {
    position: sticky;
    top: 0;
    z-index: 10;
    cursor: pointer;
}

th.sort-asc::after  { content: " ▲"; font-size: 11px; }
th.sort-desc::after { content: " ▼"; font-size: 11px; }

#eiLoytynyt {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
    color: red;
    display: none;
}

/* "Näytä lisää" -nappi listan lopussa */
#lisaaAlue {
    display: none;
    text-align: center;
    margin: 14px 0 30px 0;
}
#lisaaNappi {
    padding: 10px 18px;
    font-size: 15px;
}
#sentinelli { height: 2px; }

/* Mobiilioptimointi */
@media (max-width: 600px) {
    body.vaalea, body.tumma {
        margin: 10px;
        font-size: 14px;
    }
    #controls input {
        font-size: 16px;
        min-width: 120px;
    }
    button {
        font-size: 13px;
    }
    th, td {
        font-size: 13px;
        padding: 4px 6px;
    }
}
</style>
</head>

<body class="vaalea">

<div id="ylapalkki">
    <div class="header-row">
        <h2 id="otsikko">Karaoke kappale</h2>
        <div id="brand">Taverna</div>
    </div>

    <h3 id="haku-otsikko">Haku</h3>

    <div id="controls">
        <input id="haku" placeholder="Hae..." autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search">
        <button onclick="paivitaNappi()">NOLLAUS</button>
        <button onclick="vaihdaTeema()" id="teemanappi">Tumma teema</button>
        <button onclick="openHelp()" id="helpnappi">HELP</button>
    </div>

    <p id="paivitysaika" style="font-size:16px; font-weight:bold; margin-top:8px;">Päivitetään...</p>

    <div id="aznav">
        <button onclick="valitseKirjain('')">Kaikki</button>
        <button onclick="valitseKirjain('A')">A</button>
        <button onclick="valitseKirjain('B')">B</button>
        <button onclick="valitseKirjain('C')">C</button>
        <button onclick="valitseKirjain('D')">D</button>
        <button onclick="valitseKirjain('E')">E</button>
        <button onclick="valitseKirjain('F')">F</button>
        <button onclick="valitseKirjain('G')">G</button>
        <button onclick="valitseKirjain('H')">H</button>
        <button onclick="valitseKirjain('I')">I</button>
        <button onclick="valitseKirjain('J')">J</button>
        <button onclick="valitseKirjain('K')">K</button>
        <button onclick="valitseKirjain('L')">L</button>
        <button onclick="valitseKirjain('M')">M</button>
        <button onclick="valitseKirjain('N')">N</button>
        <button onclick="valitseKirjain('O')">O</button>
        <button onclick="valitseKirjain('P')">P</button>
        <button onclick="valitseKirjain('Q')">Q</button>
        <button onclick="valitseKirjain('R')">R</button>
        <button onclick="valitseKirjain('S')">S</button>
        <button onclick="valitseKirjain('T')">T</button>
        <button onclick="valitseKirjain('U')">U</button>
        <button onclick="valitseKirjain('V')">V</button>
        <button onclick="valitseKirjain('W')">W</button>
        <button onclick="valitseKirjain('X')">X</button>
        <button onclick="valitseKirjain('Y')">Y</button>
        <button onclick="valitseKirjain('Z')">Z</button>
        <button onclick="valitseKirjain('Å')">Å</button>
        <button onclick="valitseKirjain('Ä')">Ä</button>
        <button onclick="valitseKirjain('Ö')">Ö</button>
    </div>

    <div id="eiLoytynyt">Ei löytynyt</div>

    <h3 id="kokolista">Ladataan listaa...</h3>
</div>

<div class="table-wrapper">
<table id="taulukko">
<thead>
<tr>
    <th onclick="jarjesta('ARTISTI')" id="th-artisti">ARTISTI</th>
    <th onclick="jarjesta('KAPPALE')" id="th-kappale">KAPPALE</th>
    <th onclick="jarjesta('KONE')"    id="th-kone">KONE</th>
    <th onclick="jarjesta('KOODI')"   id="th-koodi">KOODI</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<!-- Lisää rivejä ladataan vierittäessä / napista -->
<div id="lisaaAlue">
    <button id="lisaaNappi" onclick="naytaLisaa()">Näytä lisää</button>
</div>
<div id="sentinelli"></div>

<script>
/* =====================================================================
   Taverna Eskolanmäki - karaokehaku (nopeutettu versio puhelimille)

   Tärkeimmät nopeutukset verrattuna vanhaan:
   1. Vain 120 riviä renderöidään kerralla. Loput latautuvat automaattisesti
      vieritessä (IntersectionObserver) tai "Näytä lisää" -napista.
      -> Ei enää 12 748 rivin DOM-rakennusta joka painalluksella.
   2. Hakukentässä on 100 ms debounce, eli lista ei päivity keskellä
      kirjoittamista jokaisesta näppäimestä.
   3. Järjestetyt listat lasketaan valmiiksi vain kerran per sarake+suunta.
      Haku/napit eivät enää järjestä mitään uudelleen.
   4. Kunkin rivin hakuteksti (artisti+kappale+kone+koodi) on esilaskettu
      yhdeksi merkkijonoksi -> suodatus on yksi nopea läpikäynti.
   5. Rivit rakennetaan merkkijonoista kerralla tbodyyn (paljon nopeampaa
      kuin createElement-silmukka), ja korostus tehdään turvallisesti
      HTML-escapen kautta.
   6. kappaleet.csv säilytetään selaimen muistissa (localStorage):
      lista näkyy heti käynnistyessä ja uusi data päivittyy taustalla.
   7. touch-action: napit reagoivat puhelimessa heti ilman tapausviivettä.
      Viewport-metatietoa EI ole, jotta aloitusnäkymä näkyy pienenä
      kokonaisuutena ja niputuszoomaus toimii kuten ennen.
   ===================================================================== */

function koneVari(kone) {
    if (kone === "MAD") return "#e8ffd0";
    if (kone === "MEL") return "#ffe8d0";
    return "";
}

const CHUNK = 120;           // montako riviä renderöidään kerralla
const DEBOUNCE_MS = 100;     // hakuviive millisekunteina
const CSV_URL = "https://raw.githubusercontent.com/TavernaEskolanmaki/Taverna/main/kappaleet.csv";
const CSV_CACHE_KEY = "taverna_kappaleet_csv_v1";
const UPPER = { ARTISTI: "artistUpper", KAPPALE: "kappaleUpper", KONE: "koneUpper", KOODI: "koodiUpper" };

let data = [];               // kaikki rivit
let hay = [];                // esilaskettu hakuteksti riveittäin
let sortedViews = {};        // "SARAKE_suunta" -> valmis järjestetty lista
let currentLetter = "";
let sortKey = "ARTISTI";
let sortDir = "asc";
let currentTerms = [];       // aktiiviset hakusanat
let highlightRegex = null;   // yhdistetty korostusregex
let visibleRows = [];        // suodatettu + järjestetty lista
let renderedCount = 0;       // montako riviä on nyt DOMissa
let loaded = false;
let debounceTimer = null;

/* ---------- CSV:n haku ja jäsentäminen ---------- */

function parseCSV(txt) {
    const rows = txt
        .trim()
        .split("\n")
        .map(r => r.split(","))
        .filter(r => r.length >= 4);

    return rows.map((r, idx) => ({
        ARTISTI: r[0],
        KAPPALE: r[1],
        KONE:    r[2],
        KOODI:   r[3],
        artistUpper: r[0].toUpperCase(),
        kappaleUpper: r[1].toUpperCase(),
        koneUpper: r[2].toUpperCase(),
        koodiUpper: r[3].toUpperCase(),
        index: idx
    }));
}

function alustaData(txt) {
    data = parseCSV(txt);
    hay = data.map(r => r.artistUpper + "\n" + r.kappaleUpper + "\n" + r.koneUpper + "\n" + r.koodiUpper);
    sortedViews = {};
    loaded = true;
    paivitaTaulukko();
}

function lataaCSV() {
    let cached = null;
    try { cached = localStorage.getItem(CSV_CACHE_KEY); } catch (e) {}

    // 1) Näytä välimuistissa oleva lista HETI (nopea käynnistys puhelimessa)
    if (cached) alustaData(cached);

    // 2) Hae tuore lista taustalla; päivitä näkymä vain jos data muuttunut
    fetch(CSV_URL, { cache: "no-cache" })
        .then(res => {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.text();
        })
        .then(txt => {
            if (!cached || txt !== cached) {
                try { localStorage.setItem(CSV_CACHE_KEY, txt); } catch (e) {}
                alustaData(txt);
            }
        })
        .catch(() => {
            if (!cached) {
                document.getElementById("kokolista").innerText = "Virhe listan latauksessa";
            }
        });
}

/* ---------- Järjestäminen (valmiiksi laskettu, ei toistoa hakua varten) ---------- */

function getSortedView(key, dir) {
    const id = key + "_" + dir;
    if (sortedViews[id]) return sortedViews[id];

    const arr = data.slice();
    const upKey = UPPER[key];
    const mul = dir === "asc" ? 1 : -1;
    arr.sort((a, b) => {
        const va = a[upKey], vb = b[upKey];
        if (va < vb) return -1 * mul;
        if (va > vb) return 1 * mul;
        return a.index - b.index;   // tasatilanteessa alkuperäinen järjestys
    });
    sortedViews[id] = arr;
    return arr;
}

/* ---------- Suodatus ---------- */

function haeTeksti() {
    return document.getElementById("haku").value.toUpperCase().trim();
}

function suodata() {
    const base = getSortedView(sortKey, sortDir);
    if (!currentLetter && currentTerms.length === 0) return base;

    const L = currentLetter;
    const terms = currentTerms;
    return base.filter(r => {
        if (L && !r.artistUpper.startsWith(L)) return false;
        for (let i = 0; i < terms.length; i++) {
            if (!hay[r.index].includes(terms[i])) return false;
        }
        return true;
    });
}

/* ---------- Renderöinti ---------- */

function escapeRegExp(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function escHTML(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* Korostaa hakusanoat <mark>-tageilla turvallisesti (ei innerHTML-riskiä) */
function solunHTML(teksti) {
    if (!highlightRegex) return escHTML(teksti);

    let out = "";
    let last = 0;
    let m;
    highlightRegex.lastIndex = 0;
    while ((m = highlightRegex.exec(teksti)) !== null) {
        out += escHTML(teksti.slice(last, m.index)) + "<mark>" + escHTML(m[0]) + "</mark>";
        last = m.index + m[0].length;
        if (m[0].length === 0) {
            highlightRegex.lastIndex++;
            if (highlightRegex.lastIndex > teksti.length) break;
        }
    }
    return out + escHTML(teksti.slice(last));
}

function riviHTML(r) {
    const vari = koneVari(r.KONE);
    return "<tr>"
        + "<td>" + solunHTML(r.ARTISTI) + "</td>"
        + "<td>" + solunHTML(r.KAPPALE) + "</td>"
        + '<td style="background-color:' + (vari || "transparent") + '">' + solunHTML(r.KONE) + "</td>"
        + "<td>" + solunHTML(r.KOODI) + "</td>"
        + "</tr>";
}

/* Lisää n riviä DOMiin ilman vanhojen rivien uudelleenrakentamista */
function renderLisaa(n) {
    if (!visibleRows.length) { paivitaLisaaNappi(); return; }

    const target = Math.min(renderedCount + n, visibleRows.length);
    if (target > renderedCount) {
        const parts = [];
        for (let i = renderedCount; i < target; i++) parts.push(riviHTML(visibleRows[i]));
        document.querySelector("#taulukko tbody").insertAdjacentHTML("beforeend", parts.join(""));
        renderedCount = target;
    }
    paivitaLisaaNappi();
}

function paivitaLisaaNappi() {
    const jaljella = visibleRows.length - renderedCount;
    const alue = document.getElementById("lisaaAlue");
    if (jaljella > 0) {
        alue.style.display = "block";
        document.getElementById("lisaaNappi").textContent =
            "Näytä lisää (" + jaljella + " kpl jäljellä)";
    } else {
        alue.style.display = "none";
    }
}

/* ---------- Pääpäivitys (haku, napit, järjestys) ---------- */

function paivitaTaulukko() {
    if (debounceTimer) { clearTimeout(debounceTimer); debounceTimer = null; }
    if (!loaded) return;

    const haku = haeTeksti();
    currentTerms = haku ? haku.split(/\s+/).filter(Boolean) : [];
    highlightRegex = currentTerms.length
        ? new RegExp(currentTerms.map(escapeRegExp).join("|"), "gi")
        : null;

    visibleRows = suodata();

    document.querySelector("#taulukko tbody").innerHTML = "";
    renderedCount = 0;

    const count = visibleRows.length;
    const kokolistaEl = document.getElementById("kokolista");
    if (!haku && !currentLetter) {
        kokolistaEl.innerText = "Koko lista " + data.length + " kpl";
    } else {
        kokolistaEl.innerText = "Koko lista " + count + " kpl";
    }

    document.getElementById("eiLoytynyt").style.display = count ? "none" : "block";
    paivitaSortOtsikot();
    renderLisaa(CHUNK);
}

/* ---------- Napit ---------- */

function valitseKirjain(kirjain) {
    currentLetter = kirjain;
    paivitaTaulukko();
}

function paivitaNappi() {
    document.getElementById("haku").value = "";
    currentLetter = "";
    paivitaTaulukko();
}

function naytaLisaa() {
    renderLisaa(CHUNK);
}

function vaihdaTeema() {
    const body = document.body;
    const nappi = document.getElementById("teemanappi");

    if (body.classList.contains("tumma")) {
        body.classList.remove("tumma");
        body.classList.add("vaalea");
        nappi.textContent = "Tumma teema";
    } else {
        body.classList.remove("vaalea");
        body.classList.add("tumma");
        nappi.textContent = "Vaalea teema";
    }
}

function openHelp() {
    // Vie samaan välilehteen, jotta palatessa ei synny uusia Haku-välilehtiä.
    window.location.href = "help.html";
}

function jarjesta(uusiKey) {
    if (sortKey === uusiKey) {
        sortDir = sortDir === "asc" ? "desc" : "asc";
    } else {
        sortKey = uusiKey;
        sortDir = "asc";
    }
    paivitaTaulukko();
}

function paivitaSortOtsikot() {
    const keys = ["ARTISTI","KAPPALE","KONE","KOODI"];
    keys.forEach(k => {
        const th = document.getElementById(
            k === "ARTISTI" ? "th-artisti" :
            k === "KAPPALE" ? "th-kappale" :
            k === "KONE"    ? "th-kone"    :
                              "th-koodi"
        );
        th.classList.remove("sort-asc","sort-desc");
        if (k === sortKey) {
            th.classList.add(sortDir === "asc" ? "sort-asc" : "sort-desc");
        }
    });
}

/* ---------- Päivitysaika GitHubista ---------- */

async function haePaivitysaika() {
    const apiUrl = "https://api.github.com/repos/TavernaEskolanmaki/Taverna/commits?path=kappaleet.csv";

    try {
        const res = await fetch(apiUrl);
        const commits = await res.json();

        const pvm = new Date(commits[0].commit.author.date);

        const paiva = pvm.getDate();
        const kk = pvm.getMonth() + 1;
        const vuosi = pvm.getFullYear();
        const tunnit = pvm.getHours().toString().padStart(2, "0");
        const minuutit = pvm.getMinutes().toString().padStart(2, "0");

        document.getElementById("paivitysaika").innerText =
            `Viimeksi päivitetty -> poy: ${paiva}.${kk}.${vuosi} klo ${tunnit}:${minuutit}`;

    } catch (e) {
        document.getElementById("paivitysaika").innerText = "Virhe päivitysajan haussa";
    }
}

/* ---------- Muut apurit ---------- */

/* Synkronoi hakukentän leveys otsikon renderöityyn leveyteen */
function syncHakuLeveys() {
    const otsikko = document.getElementById("otsikko");
    const haku = document.getElementById("haku");
    if (!otsikko || !haku) return;

    const w = Math.ceil(otsikko.getBoundingClientRect().width);
    haku.style.width = w + "px";
}

/* Haku debounce: lista päivittyy vasta kun kirjoittaminen hetken taukoaa */
document.getElementById("haku").addEventListener("input", () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(paivitaTaulukko, DEBOUNCE_MS);
});

/* Automaattinen lisärivien lataus vieritessä lähelle listan loppua */
if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver(entries => {
        if (entries.some(e => e.isIntersecting) && visibleRows.length - renderedCount > 0) {
            renderLisaa(CHUNK);
        }
    }, { rootMargin: "700px 0px" });
    io.observe(document.getElementById("sentinelli"));
}

window.addEventListener("load", () => {
    lataaCSV();
    haePaivitysaika();
    syncHakuLeveys();
});
window.addEventListener("resize", () => {
    syncHakuLeveys();
});
</script>

</body>
</html>
